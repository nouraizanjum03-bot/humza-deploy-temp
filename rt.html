<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Banco prova responsive — Humza</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, sans-serif; background: #2b2b33; color: #fff; padding: 16px; }
  h1 { font-size: 15px; margin-bottom: 12px; font-weight: 600; }
  .row { display: flex; gap: 18px; align-items: flex-start; overflow-x: auto; padding-bottom: 12px; }
  .device { flex: none; }
  .label { font-size: 12px; padding: 4px 0 6px; color: #b9b9c6; font-family: ui-monospace, monospace; }
  iframe { border: 0; background: #fff; display: block; box-shadow: 0 6px 24px rgba(0,0,0,.4); }
  .w360 { width: 360px; } .w390 { width: 390px; } .w768 { width: 768px; }
  .w1024 { width: 1024px; } .w1440 { width: 1440px; }
</style>
</head>
<body>
<h1 id="t">Banco prova responsive</h1>
<div class="row" id="row"></div>
<script>
  const params = new URLSearchParams(location.search);
  const path = params.get('p') || '/';
  const h = parseInt(params.get('h') || '2400', 10);
  const widths = (params.get('w') || '360,768,1024,1440').split(',');
  document.getElementById('t').textContent = 'Pagina: ' + path;
  document.getElementById('row').innerHTML = widths.map(w =>
    `<div class="device"><div class="label">${w}px</div>` +
    `<iframe class="w${w}" style="width:${w}px;height:${h}px" src="http://127.0.0.1:8899${path}?cb=${Date.now()}" loading="eager"></iframe></div>`
  ).join('');
</script>
</body>
</html>
